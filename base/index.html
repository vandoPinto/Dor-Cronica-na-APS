<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="img/favicon.jpg">
    <title>Controle de Homologação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <link href="./css/style.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid px-4">
        <div class="header-card">
            <div>
                <h1>Manejo da Dor Crônica na APS</h1>
                <p>Controle de Links e Homologação</p>
            </div>
            <img src="./img/logo_m.png" class="logo">
        </div>
        <div id="toastAtualizacao" class="toast-atualizacao" style="display:none">

            <span>
                <i class="fa-solid fa-bell"></i>
                Novas alterações encontradas
            </span>

            <button class="btn btn-sm btn-light" onclick="forcarAtualizacao()">
                Atualizar
            </button>

        </div>
        <div class="row mb-4" id="dashboard">

            <div class="col-md-3 mb-3">
                <div class="dashboard-card total">
                    <div class="titulo">Total de Itens</div>
                    <div class="valor" id="totalItens">0</div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="dashboard-card finalizado">
                    <div class="titulo">Finalizados</div>
                    <div class="valor" id="totalFinalizados">0</div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="dashboard-card ajuste">
                    <div class="titulo">Em Ajuste</div>
                    <div class="valor" id="totalAjuste">0</div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="dashboard-card pendente">
                    <div class="titulo">Pendentes</div>
                    <div class="valor" id="totalPendentes">0</div>
                </div>
            </div>

        </div>

        <div class="dashboard-progress">

            <div class="d-flex justify-content-between mb-2">

                <strong>Progresso Geral</strong>

                <strong id="percentualConclusao">0%</strong>

            </div>

            <div class="progress" style="height:30px">

                <div id="barraConclusao" class="progress-bar bg-success" role="progressbar" style="width:0%">
                </div>

            </div>

        </div>
        <div id="modulos"></div>
    </div>

    <script>

        const API_URL = "https://script.google.com/macros/s/AKfycbwCtrpUYvsdyZpyCHfHFTcXpHBDylsmpOxTS3QO91_bbvzlH4-EZxRnO60r-RxTREq74A/exec";
        let hashAtual = "";

        async function carregarDados() {

            const container = document.getElementById("modulos");

            container.innerHTML = `
            <div class="text-center p-5">
                <div class="spinner-border"></div>
            </div>
        `;

            try {

                const response = await fetch(API_URL);
                const registros = await response.json();
                hashAtual = JSON.stringify(registros);
                const totalItens = registros.length;

                const totalFinalizados = registros.filter(
                    item => item.finalizado === true
                ).length;

                const totalAjuste = registros.filter(
                    item => item.ajuste === true &&
                        item.finalizado !== true
                ).length;

                const totalPendentes =
                    totalItens -
                    totalFinalizados -
                    totalAjuste;

                const percentual =
                    totalItens > 0
                        ? ((totalFinalizados / totalItens) * 100)
                            .toFixed(1)
                        : 0;

                document.getElementById("totalItens").textContent =
                    totalItens;

                document.getElementById("totalFinalizados").textContent =
                    totalFinalizados;

                document.getElementById("totalAjuste").textContent =
                    totalAjuste;

                document.getElementById("totalPendentes").textContent =
                    totalPendentes;

                document.getElementById("percentualConclusao").textContent =
                    percentual + "%";

                document.getElementById("barraConclusao").style.width =
                    percentual + "%";

                document.getElementById("barraConclusao").textContent =
                    percentual + "%";

                const dados = {};

                registros.forEach(item => {

                    if (!dados[item.modulo]) {
                        dados[item.modulo] = [];
                    }

                    dados[item.modulo].push(item);

                });

                container.innerHTML = "";

                Object.keys(dados).forEach(modulo => {

                    let linhas = "";

                    dados[modulo].forEach(item => {

                        linhas += `
                    <tr>

                        <td>${item.id}</td>

                        <td>
                            <a href="${item.url}" target="_blank">
                                ${item.link}
                            </a>
                        </td>

                        <td>
                            <input
                                class="form-check-input"
                                type="checkbox"
                                ${item.ajuste ? "checked" : ""}
                                onchange="atualizarItem(
                                    '${item.modulo}',
                                    '${item.id}',
                                    this.checked,
                                    ${item.finalizado}
                                )">
                        </td>

                        <td>
                            <input
                                class="form-check-input"
                                type="checkbox"
                                ${item.finalizado ? "checked" : ""}
                                onchange="atualizarItem(
                                    '${item.modulo}',
                                    '${item.id}',
                                    ${item.ajuste},
                                    this.checked
                                )">
                        </td>

                        <td>

                            ${item.relatorio
                                ? `
                                <a
                                    href="${item.relatorio}"
                                    target="_blank"
                                    class="btn btn-sm btn-outline-primary"
                                >
                                    <i class="fa-solid fa-file-word"></i>
                                    Abrir Relatório
                                </a>
                                `
                                : "-"
                            }

                        </td>

                      <td>

                   <textarea
                        class="campo-observacao"
                        oninput="salvarObservacao(
                            '${item.modulo}',
                            '${item.id}',
                            this.value,
                            this
                        )"
                    >${item.observacao || ''}</textarea>

                    </td>

                    </tr>
                    `;

                    });

                    container.innerHTML += `

                <div class="module-card">

                    <div class="module-header">

                        <span>
                            <i class="fa-solid fa-book"></i>
                            ${modulo}
                        </span>

                        <span>
                            ${dados[modulo].length} itens
                        </span>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead>

                                <tr>

                                    <th>ID</th>
                                    <th>Link</th>
                                    <th>Ajuste</th>
                                    <th>Finalizado</th>
                                    <th>Relatório</th>
                                    <th>Observações</th>

                                </tr>

                            </thead>

                            <tbody>

                                ${linhas}

                            </tbody>

                        </table>

                    </div>

                </div>

                `;

                });

            } catch (erro) {

                container.innerHTML = `
                <div class="alert alert-danger">
                    Erro ao carregar os dados.
                </div>
            `;

                console.error(erro);

            }

        }

        async function atualizarItem(
            modulo,
            id,
            ajuste,
            finalizado
        ) {

            try {

                await fetch(
                    `${API_URL}?acao=salvar` +
                    `&modulo=${encodeURIComponent(modulo)}` +
                    `&id=${encodeURIComponent(id)}` +
                    `&ajuste=${ajuste}` +
                    `&finalizado=${finalizado}`
                );

            } catch (erro) {

                console.error(erro);

                alert("Erro ao salvar.");

            }

        }

        const timersObservacao = {};

        function salvarObservacao(
            modulo,
            id,
            observacao,
            elemento
        ) {

            const chave = `${modulo}_${id}`;

            elemento.classList.remove("salvo");
            elemento.classList.add("salvando");

            clearTimeout(timersObservacao[chave]);

            timersObservacao[chave] = setTimeout(async () => {

                try {

                    await fetch(
                        `${API_URL}?acao=observacao` +
                        `&modulo=${encodeURIComponent(modulo)}` +
                        `&id=${encodeURIComponent(id)}` +
                        `&observacao=${encodeURIComponent(observacao)}`
                    );

                    elemento.classList.remove("salvando");
                    elemento.classList.add("salvo");

                } catch (erro) {

                    console.error(erro);

                    elemento.classList.remove("salvando");

                }

            }, 800);

        }

        async function verificarAtualizacoes() {

            try {

                const response = await fetch(API_URL);

                const registros = await response.json();

                const novoHash =
                    JSON.stringify(registros);

                if (
                    hashAtual &&
                    novoHash !== hashAtual
                ) {

                    document
                        .getElementById(
                            "toastAtualizacao"
                        )
                        .style.display = "flex";

                }

            } catch (erro) {

                console.error(erro);

            }

        }

        function forcarAtualizacao() {

            document
                .getElementById(
                    "toastAtualizacao"
                )
                .style.display = "none";

            carregarDados();

        }

        carregarDados();

        setInterval(() => {

            verificarAtualizacoes();

        }, 15000);

    </script>
</body>

</html>
