<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="img/favicon.jpg">
    <title>Controle de Homologação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="./css/style.css" rel="stylesheet">
    <script src="./js/script.js" defer></script>
</head>

<body>

    <div class="container-fluid px-4">
        <div class="header-card">
            <div>
                <h1>Manejo da Dor Crônica na APS</h1>
                <p>Controle de Links e Homologação - v.1.3</p>
            </div>
            <img src="./img/logo_m.png" class="logo">
        </div>
        <div id="toastAtualizacao" class="toast-atualizacao" style="display:none">

            <span>
                <i class="fa-solid fa-bell"></i>
                Novas alterações encontradas
            </span>

            <button class="btn btn-sm btn-light" onclick="forcarAtualizacao()">
                Atualizar
            </button>

        </div>
        <div id="toastErro" class="toast-atualizacao" style="display:none;background:#dc3545">

            <span id="mensagemErro">
                Erro ao salvar
            </span>

            <button class="btn btn-sm btn-light" onclick="refazerUltimaAcao()">

                Tentar novamente

            </button>

        </div>
        <div class="row mb-4" id="dashboard">

            <div class="col-md-3 mb-3">
                <div class="dashboard-card total">
                    <div class="titulo">Total de Itens</div>
                    <div class="valor" id="totalItens">0</div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="dashboard-card finalizado">
                    <div class="titulo">Finalizados</div>
                    <div class="valor" id="totalFinalizados">0</div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="dashboard-card ajuste">
                    <div class="titulo">Em Ajuste</div>
                    <div class="valor" id="totalAjuste">0</div>
                </div>
            </div>

            <div class="col-md-3 mb-3">
                <div class="dashboard-card pendente">
                    <div class="titulo">Pendentes</div>
                    <div class="valor" id="totalPendentes">0</div>
                </div>
            </div>

        </div>

        <div class="dashboard-progress">

            <div class="d-flex justify-content-between mb-2">

                <strong>Progresso Geral</strong>

                <strong id="percentualConclusao">0%</strong>

            </div>

            <div class="progress" style="height:30px">

                <div id="barraConclusao" class="progress-bar bg-success" role="progressbar" style="width:0%">
                </div>

            </div>

        </div>
        <div id="modulos"></div>
    </div>
</body>

</html>
