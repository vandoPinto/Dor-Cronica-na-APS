<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Controle de Homologação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #f4f6f9;
            font-family: 'Segoe UI', sans-serif
        }

        .header-card {
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            margin: 25px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .08)
        }

        .logo {
            height: 70px
        }

        .module-card {
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, .05)
        }

        .module-header {
            background: linear-gradient(135deg, #1f4b99, #2f6ad9);
            color: #fff;
            padding: 16px 24px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            justify-content: space-between
        }

        .table thead {
            background: #edf2f7
        }

        .table thead th {
            font-size: 12px;
            text-transform: uppercase
        }

        .form-check-input {
            width: 20px;
            height: 20px
        }
    </style>
</head>

<body>
    <div class="container-fluid px-4">
        <div class="header-card">
            <div>
                <h1>Manejo da Dor Crônica na APS</h1>
                <p>Controle de Links e Homologação</p>
            </div>
            <img src="./img/logo_m.png" class="logo">
        </div>
        <div id="modulos"></div>
    </div>

    <script>

        const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnThQQc6iVn00yqXd1mtqjRE_pt-6rN54Key0It6aaC8iiVBR9KUQ754RYV_pbUOuz22RMmCbVxMTFCR4raddjL-gCLDBJUVPC-qhtRCXSmjFnt9Kg4iokNu05jdV4pNC1tenGZ0drWiXOoPD5CWqGW3bb-4lkuhJBurjDvfmv38fsdO5W_J-4xONNXiZe4-IbxLGLjMwsHLPTX7PKbkjaoA6JVRPOZpn0Uktnf0Rf9VB2c2Q69tBIzFf2svwX3hpNDXSLIFXAI82Jvdez_txXljS3RlDA&lib=MjoRWqGLqDV2g4X_lv7YcrJQ0diIM-AQg";

        async function carregarDados() {

            const container = document.getElementById("modulos");

            container.innerHTML = `
            <div class="text-center p-5">
                <div class="spinner-border"></div>
            </div>
        `;

            try {

                const response = await fetch(API_URL);
                const registros = await response.json();

                const dados = {};

                registros.forEach(item => {

                    if (!dados[item.modulo]) {
                        dados[item.modulo] = [];
                    }

                    dados[item.modulo].push(item);

                });

                container.innerHTML = "";

                Object.keys(dados).forEach(modulo => {

                    let linhas = "";

                    dados[modulo].forEach(item => {

                        linhas += `
                    <tr>

                        <td>${item.id}</td>

                        <td>
                            <a href="${item.url}" target="_blank">
                                ${item.link}
                            </a>
                        </td>

                        <td>
                            <input
                                class="form-check-input"
                                type="checkbox"
                                ${item.ajuste ? "checked" : ""}
                                onchange="atualizarItem(
                                    '${item.modulo}',
                                    '${item.id}',
                                    this.checked,
                                    ${item.finalizado}
                                )">
                        </td>

                        <td>
                            <input
                                class="form-check-input"
                                type="checkbox"
                                ${item.finalizado ? "checked" : ""}
                                onchange="atualizarItem(
                                    '${item.modulo}',
                                    '${item.id}',
                                    ${item.ajuste},
                                    this.checked
                                )">
                        </td>

                        <td>${item.relatorio}</td>

                        <td>${item.observacao}</td>

                    </tr>
                    `;

                    });

                    container.innerHTML += `

                <div class="module-card">

                    <div class="module-header">

                        <span>
                            <i class="fa-solid fa-book"></i>
                            ${modulo}
                        </span>

                        <span>
                            ${dados[modulo].length} itens
                        </span>

                    </div>

                    <div class="table-responsive">

                        <table class="table table-hover align-middle mb-0">

                            <thead>

                                <tr>

                                    <th>ID</th>
                                    <th>Link</th>
                                    <th>Ajuste</th>
                                    <th>Finalizado</th>
                                    <th>Relatório</th>
                                    <th>Observações</th>

                                </tr>

                            </thead>

                            <tbody>

                                ${linhas}

                            </tbody>

                        </table>

                    </div>

                </div>

                `;

                });

            } catch (erro) {

                container.innerHTML = `
                <div class="alert alert-danger">
                    Erro ao carregar os dados.
                </div>
            `;

                console.error(erro);

            }

        }

        async function atualizarItem(
            modulo,
            id,
            ajuste,
            finalizado
        ) {

            try {

                const form = new FormData();

                form.append("modulo", modulo);
                form.append("id", id);
                form.append("ajuste", ajuste);
                form.append("finalizado", finalizado);

                await fetch(API_URL, {
                    method: "POST",
                    body: form
                });

            } catch (erro) {

                console.error(erro);

                alert("Erro ao salvar.");

            }

        }

        carregarDados();

    </script>
</body>

</html>
