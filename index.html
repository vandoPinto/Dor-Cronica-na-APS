<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Oferta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f3f4f7;
            font-family: 'Segoe UI', sans-serif;
        }

        /* SIDEBAR */

        .sidebar {
            width: 250px;
            height: 100vh;
            background: linear-gradient(#31333b, #16171d);
            position: fixed;
            left: 0;
            top: 0;
            color: #fff;
        }

        .logo {
            padding: 25px;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, .1);
        }

        .menu {
            list-style: none;
            padding: 20px 0;
        }

        .menu li {
            margin: 8px 10px;
        }

        .menu a {
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 18px;
            border-radius: 8px;
            transition: .3s;
        }

        .menu a:hover,
        .menu .active a {
            background: rgba(255, 255, 255, .12);
        }

        /* CONTEÚDO */

        .main {
            margin-left: 250px;
            padding: 20px;
        }

        /* TOPBAR */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .menu-btn {
            font-size: 22px;
            cursor: pointer;
        }

        .user {
            font-size: 22px;
            color: #777;
        }

        /* CARD */

        .card-area {
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .05);
        }

        .section-title {
            font-size: 36px;
            font-weight: 700;
            color: #26334d;
        }

        .subtitle {
            color: #888;
            margin-bottom: 25px;
        }

        .filters-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        /* FILTROS */

        .filters {
            display: grid;
            grid-template-columns:
                100px 1fr 1.2fr 1.2fr 1.2fr auto;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-search {
            background: #00886f;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
        }

        .btn-search:hover {
            background: #006d5a;
        }

        /* TABELA */

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .table thead {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
        }

        .table tbody tr {
            height: 75px;
        }

        .table tbody tr:nth-child(even) {
            background: #fafafa;
        }

        .action-btn {
            width: 55px;
            height: 40px;
            border: none;
            border-radius: 8px;
            background: #007f97;
            color: #fff;
        }

        .action-btn:hover {
            background: #00687d;
        }

        @media(max-width:1200px) {

            .filters {
                grid-template-columns: 1fr;
            }

            .btn-search {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            Admin - Sistema de Oferta
        </div>

        <ul class="menu">

            <li>
                <a href="#">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-table-cells"></i>
                    Dashboard Geral
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-tv"></i>
                    Cursos
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-clipboard"></i>
                    Certificados
                </a>
            </li>

            <li class="active">
                <a href="#">
                    <i class="fa-solid fa-users"></i>
                    Usuários
                </a>
            </li>

            <li>
                <a href="#">
                    <i class="fa-solid fa-signature"></i>
                    Assinaturas
                </a>
            </li>

        </ul>

    </div>

    <!-- MAIN -->

    <div class="main">

        <div class="topbar">

            <div class="topbar-left">

                <strong>Usuários</strong>

                <i class="fa-solid fa-bars menu-btn"></i>

            </div>

            <div class="user">
                <i class="fa-solid fa-circle-user"></i>
            </div>

        </div>

        <div class="card-area">

            <div class="d-flex justify-content-between align-items-start">

                <div>

                    <h2 class="section-title">
                        Lista de Usuários
                    </h2>

                    <div class="subtitle">
                        Total de resultados: 100
                    </div>

                </div>

            </div>

            <div class="filters-title">
                Filtros
            </div>

            <div class="filters">

                <input class="form-control" placeholder="ID">

                <input class="form-control" placeholder="ID AVA">

                <input class="form-control" placeholder="Nome">

                <input class="form-control" placeholder="CPF">

                <input class="form-control" placeholder="E-mail">

                <button class="btn-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    Buscar
                </button>

            </div>

            <div class="table-header">

                <select class="form-select w-auto">
                    <option>10</option>
                    <option>25</option>
                    <option>50</option>
                </select>

                <input type="text" class="form-control w-auto" placeholder="Search...">

            </div>

            <table class="table align-middle">

                <thead>
                    <tr>
                        <th>ID DO USUÁRIO</th>
                        <th>ID USUÁRIO NO AVA</th>
                        <th>QTD INSCRIÇÕES</th>
                        <th>NOME</th>
                        <th>CPF</th>
                        <th>E-MAIL</th>
                        <th>TIPO AUTENTICAÇÃO</th>
                        <th>AÇÕES</th>
                    </tr>
                </thead>

                <tbody id="usuarios">

                </tbody>

            </table>

        </div>

    </div>

    </script>

</body>

</html>
