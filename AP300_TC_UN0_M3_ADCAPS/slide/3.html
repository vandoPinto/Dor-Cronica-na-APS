<!-- MODAL -->
<div class="modal fade" id="videoModal" tabindex="-1">
    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"
        style="position: absolute; top: 1rem; right: 4rem;"></button>
    <div class="modal-dialog modal-xl modal-dialog-centered">
        <div class="modal-content">

            <!-- BODY -->
            <div class="modal-body p-0" style="height:80vh;">

                <iframe id="youtubeVideo" width="100%" height="100%" src="https://www.youtube.com/embed/g7blF_o0M5c"
                    title="Estratégias para melhorar a comunicação na APS - Manejo da Dor Crônica na APS - (AU.3.1.1)"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

            </div>

        </div>
    </div>
</div>

<script>
    $('#videoModal').on('hidden.bs.modal', function () {
        let iframe = $('#youtubeVideo');
        let src = iframe.attr('src');

        iframe.attr('src', '');
        iframe.attr('src', src);
    });

</script>
